name: 'container beta'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published Maven package version (for example 0.35.185.42)'
        required: true
        type: string
      push:
        description: 'Push image tags to ghcr.io and Docker Hub (false builds only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  container:
    uses: ./.github/workflows/container.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      prerelease: true
      push: ${{ inputs.push }}
