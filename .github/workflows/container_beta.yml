name: 'container beta'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published Maven package version (for example 0.35.185.42)'
        required: true
        type: string
      push:
        description: 'Push image tags to ghcr.io and Docker Hub (false builds only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download JAR from Maven package
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl --fail --silent --show-error --location \
            --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            --output docker/ajcore.jar \
            "https://maven.pkg.github.com/applejuicenetz/core/de/applejuicenet/ajcore/${VERSION}/ajcore-${VERSION}.jar"
          test -s docker/ajcore.jar

      - name: Login to ghcr.io
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to DockerHub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ github.repository }}
          tags: |
            type=raw,value=beta
            type=raw,value=beta-${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker/
          file: ./docker/Beta.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
