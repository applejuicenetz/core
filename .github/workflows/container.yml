name: 'container'

on:
  workflow_call:
    inputs:
      version:
        description: 'Published Maven package version (empty: latest stable GitHub release)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Push beta tags instead of latest tags'
        required: false
        default: false
        type: boolean
      push:
        description: 'Push image tags to ghcr.io and Docker Hub (false builds only)'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: 'Published Maven package version (empty: latest stable GitHub release)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Push beta tags instead of latest tags'
        required: true
        default: false
        type: boolean
      push:
        description: 'Push image tags to ghcr.io and Docker Hub (false builds only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: core-container-${{ inputs.prerelease && 'beta' || 'latest' }}
  cancel-in-progress: false

jobs:
  container:
    if: github.ref == 'refs/heads/main' || inputs.push == false
    runs-on: ubuntu-latest
    env:
      DO_PUSH: ${{ inputs.push }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version and tags
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          if [[ -z "$version" ]]; then
            version="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$PRERELEASE" == "true" ]]; then
            channel=beta
          else
            channel=latest
          fi
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "type=raw,value=${channel}"
            if [[ "$channel" == "beta" ]]; then
              echo "type=raw,value=beta-${version}"
            else
              echo "type=raw,value=${version}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download JAR from Maven package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            --output docker/ajcore.jar \
            "https://maven.pkg.github.com/applejuicenetz/core/de/applejuicenet/ajcore/${VERSION}/ajcore-${VERSION}.jar"
          test -s docker/ajcore.jar

      - name: Login to ghcr.io
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to DockerHub
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ github.repository }}
          flavor: latest=false
          tags: ${{ steps.version.outputs.tags }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker/
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DO_PUSH == 'true' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
