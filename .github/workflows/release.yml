name: Build core packages and release

on:
  registry_package:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published Maven package version (for example 0.35.185.42)'
        required: true
        type: string
      dry_run:
        description: 'Build packages only; do not create or update a GitHub release or tag'
        required: true
        default: true
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as pre-release (only used when dry_run is false)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: core-packages-${{ github.event.inputs.version || github.event.registry_package.package_version.version }}
  cancel-in-progress: true

jobs:
  package-info:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.registry_package.package_type == 'maven' &&
       github.event.registry_package.name == 'de.applejuicenet.ajcore')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer-version: ${{ steps.version.outputs.installer-version }}
      complete: ${{ steps.version.outputs.complete }}
    steps:
      - name: Resolve completed Maven publication
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              version = event['inputs']['version']
              complete = True
          else:
              package = event['registry_package']['package_version']
              version = package['version']
              complete = len(package['package_files']) == 6
          if not re.fullmatch(r'0\.[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected a numeric 0.major.minor.build Maven version')
          major, minor, build = map(int, version.split('.')[1:])
          if major == 0 or major > 255 or minor > 255 or build > 65535:
              raise SystemExit('Version exceeds native installer limits')
          installer_version = f'{major}.{minor}.{build}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ninstaller-version={installer_version}\ncomplete={str(complete).lower()}\n')
          if not complete:
              print('Waiting for all six Maven package files')
          PY

  build-packages:
    needs: package-info
    if: needs.package-info.outputs.complete == 'true'
    uses: ./.github/workflows/package-artifacts.yml
    with:
      version: ${{ needs.package-info.outputs.version }}
      packaging_ref: ${{ github.sha }}

  publish-release:
    needs: [package-info, build-packages]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AJCore-packages-${{ needs.package-info.outputs.version }}
          path: target
      - name: Publish approved GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package-info.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: appleJuice Core ${{ needs.package-info.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.prerelease == false }}
          body: aktuelles Changelog befindet sich [hier](https://github.com/applejuicenetz/core/blob/main/CHANGELOG.md)
          fail_on_unmatched_files: true
          files: |
            target/AJCore-macos-amd64.dmg
            target/AJCore-macos-aarch64.dmg
            target/AJCore-windows-amd64.exe
            target/AJCore-windows-aarch64.exe
            target/AJCore-linux-amd64.flatpak
            target/AJCore-linux-aarch64.flatpak
            target/ajcore-${{ needs.package-info.outputs.version }}.jar

  notify-flatpak:
    needs: publish-release
    if: needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger flatpak repository sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_DISPATCH_TOKEN }}
        run: gh api repos/applejuicenetz/flatpak/dispatches -f event_type=flatpak-release

  container:
    needs: [package-info, publish-release]
    if: needs.publish-release.result == 'success'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/container.yml
    secrets: inherit
    with:
      version: ${{ needs.package-info.outputs.version }}
      prerelease: ${{ inputs.prerelease }}
      push: true
